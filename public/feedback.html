<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>La tua esperienza al Muretto</title>
    <link rel="stylesheet" href="/styles.css?v=24">
  </head>
  <body>
    <main class="shell public-shell">
      <section class="public-booking-page feedback-page">
        <header class="public-booking-hero">
          <div class="monogram" data-brand-monogram>M</div>
          <div>
            <p class="eyebrow" data-brand-category>Bistrot</p>
            <h1 class="brand-logo-heading"><img class="brand-logo" src="/muretto-logo.png" alt="Muretto"></h1>
            <p id="feedbackIntro">La tua opinione conta davvero.</p>
          </div>
        </header>

        <section id="feedbackLoading" class="public-booking-form">
          <p>Caricamento del questionario…</p>
        </section>

        <form id="feedbackForm" class="public-booking-form" hidden>
          <div class="form-head">
            <div>
              <h2 id="feedbackTitle">Com'è andata?</h2>
              <p id="feedbackDescription">Un minuto del tuo tempo ci aiuta a migliorare.</p>
            </div>
          </div>

          <label>
            <span id="ratingLabel">Quanto sei soddisfatto della tua esperienza?</span>
            <select name="rating" required>
              <option value="" selected>Scegli un punteggio</option>
              <option value="5">5 — Eccellente</option>
              <option value="4">4 — Molto buona</option>
              <option value="3">3 — Buona, ma migliorabile</option>
              <option value="2">2 — Deludente</option>
              <option value="1">1 — Insoddisfacente</option>
            </select>
          </label>

          <label id="feedbackCommentField" hidden>
            <span id="feedbackCommentLabel">Ci dispiace. Cosa possiamo migliorare?</span>
            <textarea name="comment" maxlength="1000" rows="6" placeholder="Raccontaci cosa è successo"></textarea>
          </label>

          <button type="submit" id="feedbackSubmit">Invia il feedback</button>
          <p id="feedbackMessage" class="message" role="status"></p>
        </form>

        <section id="feedbackThankYou" class="public-booking-form" hidden>
          <h2 id="feedbackThankYouTitle">Grazie per il tuo tempo.</h2>
          <p id="feedbackThankYouText">La tua risposta è stata registrata e sarà letta dal nostro staff.</p>
          <a id="googleReviewLink" class="ghost-link public-map-link" target="_blank" rel="noopener noreferrer" hidden>Lascia una recensione su Google</a>
        </section>
      </section>
    </main>
    <script src="/feedback.js?v=1" type="module"></script>
  </body>
</html>
