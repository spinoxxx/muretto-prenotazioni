<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendario Muretto</title>
    <link rel="stylesheet" href="/styles.css?v=32">
  </head>
  <body>
    <main class="shell calendar-shell">
      <section id="calendarLoginView" class="login-view" hidden>
        <div class="brand-panel" aria-hidden="true">
          <div class="monogram" data-brand-monogram>M</div>
          <div>
            <p class="eyebrow" data-brand-category>Bistrot</p>
            <h1 class="brand-logo-heading"><img class="brand-logo" src="/muretto-logo.png" alt="Muretto"></h1>
            <p>Calendario interno riservato allo staff autorizzato.</p>
          </div>
        </div>

        <form id="calendarLoginForm" class="login-card" autocomplete="off">
          <h2>Accesso calendario</h2>
          <label>
            Nome dipendente
            <input name="name" type="text" autocomplete="username" required>
          </label>
          <label>
            PIN
            <input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" autocomplete="current-password" required>
          </label>
          <button type="submit">Entra</button>
          <a class="ghost-link public-booking-link" href="/agenda.html">Agenda tavoli</a>
          <p id="calendarLoginError" class="error" role="alert"></p>
        </form>
      </section>

      <section id="calendarView" class="app-view calendar-view" hidden>
        <header class="topbar">
          <div>
            <p class="eyebrow">Calendario</p>
            <h1 class="brand-logo-heading"><img class="brand-logo" src="/muretto-logo.png" alt="Muretto"></h1>
          </div>
          <div class="session">
            <span id="calendarEmployeeName"></span>
            <a class="ghost-link" href="/">Pannello</a>
            <a class="ghost-link" href="/agenda.html">Agenda</a>
            <button id="openCalendarEventManager" class="ghost" type="button" hidden>Nuovo evento</button>
            <button id="calendarLogoutButton" class="ghost" type="button">Esci</button>
          </div>
        </header>

        <section class="calendar-controls" aria-label="Navigazione calendario">
          <div>
            <p class="eyebrow">Periodo</p>
            <p id="calendarRangeLabel"></p>
          </div>
          <div class="calendar-toolbar">
            <button id="calendarPrevButton" class="ghost icon-button" type="button" aria-label="Periodo precedente">‹</button>
            <input id="calendarDate" type="date" aria-label="Data calendario">
            <button id="calendarNextButton" class="ghost icon-button" type="button" aria-label="Periodo successivo">›</button>
            <button id="calendarTodayButton" class="ghost today-button" type="button">Oggi</button>
            <select id="calendarViewMode" aria-label="Vista calendario">
              <option value="week">Settimana</option>
              <option value="day">Giorno</option>
              <option value="month">Mese</option>
            </select>
          </div>
        </section>

        <section class="calendar-filters" aria-label="Filtri calendario">
          <label>
            Sala
            <select id="calendarRoomFilter">
              <option value="">Tutte</option>
              <option value="Ristorante Esterno">Ristorante Esterno</option>
              <option value="Bar">Bar</option>
              <option value="Giardino">Giardino</option>
              <option value="Interno">Interno</option>
            </select>
          </label>
          <label>
            Stato
            <select id="calendarStatusFilter">
              <option value="">Tutti</option>
              <option value="confermata">Confermata</option>
              <option value="in attesa">In attesa</option>
              <option value="da verificare">Da verificare</option>
              <option value="arrivati">Arrivati</option>
              <option value="annullata">Annullata</option>
              <option value="completata">Completata</option>
              <option value="nuova">Speciale: nuova</option>
              <option value="in trattativa">Speciale: in trattativa</option>
              <option value="persa">Speciale: persa</option>
            </select>
          </label>
          <label>
            Tipo
            <select id="calendarTypeFilter">
              <option value="">Tutti</option>
              <option value="standard">Prenotazioni</option>
              <option value="special">Gruppi / eventi</option>
              <option value="event">Eventi Muretto</option>
            </select>
          </label>
        </section>

        <details id="calendarEventManager" class="calendar-event-manager" hidden>
          <summary>Gestisci eventi Muretto</summary>
          <div class="calendar-event-manager-body">
            <form id="calendarEventForm" class="calendar-event-form">
              <input name="id" type="hidden">
              <label>
                Titolo evento
                <input name="title" type="text" maxlength="100" required placeholder="Es. Serata jazz">
              </label>
              <label>
                Prima data
                <input name="date" type="date" required>
              </label>
              <label>
                Ora facoltativa
                <input name="time" type="time">
              </label>
              <label>
                Sala facoltativa
                <select name="room">
                  <option value="">Tutto il locale</option>
                  <option value="Ristorante Esterno">Ristorante Esterno</option>
                  <option value="Bar">Bar</option>
                  <option value="Giardino">Giardino</option>
                  <option value="Interno">Interno</option>
                </select>
              </label>
              <label>
                Ripetizione
                <select name="recurrence">
                  <option value="none">Una sola volta</option>
                  <option value="weekly">Ogni settimana</option>
                </select>
              </label>
              <label class="calendar-event-notes">
                Note
                <input name="notes" type="text" maxlength="800" placeholder="Dettagli interni facoltativi">
              </label>
              <label class="calendar-event-public-toggle">
                <input name="publicEnabled" type="checkbox">
                Pubblica sul modulo prenotazioni
              </label>
              <div class="calendar-event-public-fields" data-public-event-fields hidden>
                <label>
                  Descrizione pubblica
                  <textarea name="publicDescription" maxlength="1200" rows="4" placeholder="Programma e dettagli dell'evento"></textarea>
                </label>
                <label>
                  Descrizione inglese facoltativa
                  <textarea name="publicDescriptionEn" maxlength="1200" rows="4"></textarea>
                </label>
                <label>
                  Prezzo / formula
                  <input name="priceLabel" type="text" maxlength="100" placeholder="Es. 45€ a persona, bevande escluse">
                </label>
                <label>
                  Prezzo in inglese facoltativo
                  <input name="priceLabelEn" type="text" maxlength="100">
                </label>
                <label>
                  Pubblica quanti giorni prima
                  <input name="publishDaysBefore" type="number" min="0" max="180" value="14">
                </label>
                <label>
                  Locandina JPG, PNG o WebP
                  <input name="posterFile" type="file" accept="image/jpeg,image/png,image/webp">
                </label>
                <label>
                  Menu PDF facoltativo
                  <input name="menuFile" type="file" accept="application/pdf">
                </label>
                <label>
                  Testo pulsante menu
                  <input name="menuLabel" type="text" maxlength="80" value="Apri il menu">
                </label>
                <label class="calendar-event-public-toggle">
                  <input name="bookingEnabled" type="checkbox" checked>
                  Mostra il pulsante “Prenota l'evento”
                </label>
                <p class="field-help">Locandina e menu diventano pubblici solo quando attivi la pubblicazione.</p>
              </div>
              <div class="calendar-event-form-actions">
                <button type="submit">Salva evento</button>
                <button class="ghost" type="button" data-reset-calendar-event>Pulisci</button>
              </div>
              <p id="calendarEventError" class="error" role="alert"></p>
            </form>
            <div id="calendarEventList" class="calendar-event-list"></div>
          </div>
        </details>

        <section class="calendar-layout">
          <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
          <aside id="calendarDetail" class="calendar-detail">
            <p class="empty">Seleziona un blocco per vedere il dettaglio.</p>
          </aside>
        </section>
      </section>
    </main>
    <script src="/calendario.js?v=7" type="module"></script>
  </body>
</html>
